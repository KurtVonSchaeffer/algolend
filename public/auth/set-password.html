<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password — AlgoLend</title>
  <link rel="stylesheet" href="/shared/theme.css" />
  <script type="module" src="/shared/theme-init.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      background: #FDF9F6;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      margin: 16px;
    }
    .logo { width: 120px; margin-bottom: 28px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #1a1f36; margin-bottom: 6px; }
    p.sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }
    label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #374151; margin-bottom: 6px; }
    input[type="password"] {
      width: 100%; border: 1.5px solid #e5e7eb; border-radius: 12px;
      padding: 11px 14px; font-size: 0.95rem; outline: none;
      transition: border-color .15s;
      margin-bottom: 18px;
    }
    input[type="password"]:focus { border-color: var(--color-primary, #7C3AED); }
    button[type="submit"] {
      width: 100%; padding: 13px;
      background: var(--color-primary, #7C3AED);
      color: #fff; border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: opacity .15s;
    }
    button[type="submit"]:disabled { opacity: .6; cursor: default; }
    .msg { border-radius: 10px; padding: 12px 14px; font-size: 0.875rem; font-weight: 500; margin-bottom: 16px; display: none; }
    .msg.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .expired { text-align: center; color: #6b7280; font-size: 0.9rem; display: none; }
    .expired strong { display: block; font-size: 1.1rem; color: #1a1f36; margin-bottom: 8px; }
    .spinner { text-align: center; color: #9ca3af; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/shared/algolend-logo.svg" alt="AlgoLend" onerror="this.style.display='none'" />

    <div id="loading" class="spinner">
      <i class="fa-solid fa-spinner fa-spin" style="font-size:24px;"></i>
      <p style="margin-top:10px;font-size:.85rem;">Verifying your invite link…</p>
    </div>

    <div id="form-section" style="display:none;">
      <h1>Set your password</h1>
      <p class="sub">Choose a strong password to secure your AlgoLend admin account.</p>

      <div id="msg-error" class="msg error"></div>
      <div id="msg-success" class="msg success"></div>

      <form id="set-password-form">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="Min 8 characters" minlength="8" required autocomplete="new-password" />
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" placeholder="Repeat password" minlength="8" required autocomplete="new-password" />
        <button type="submit" id="submit-btn">Set Password &amp; Sign In</button>
      </form>
    </div>

    <div id="expired-section" class="expired">
      <strong>Invite link expired</strong>
      This link is no longer valid. Contact your administrator to send a new invite.
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL  = "https://yakhrwrfmdrnhfgzfiwm.supabase.co";
    const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlha2hyd3JmbWRybmhmZ3pmaXdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMjAwMTYsImV4cCI6MjA5NTg5NjAxNn0.lgm1jvglC16RtqbGdiDNJcyLfobX-4F5AlKmoHZPCG4";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        storage: window.localStorage,
        detectSessionInUrl: true,
        autoRefreshToken: true,
        persistSession: true,
      }
    });

    const $ = id => document.getElementById(id);

    function showError(msg) {
      $('msg-error').textContent = msg;
      $('msg-error').style.display = 'block';
      $('msg-success').style.display = 'none';
    }

    function showSuccess(msg) {
      $('msg-success').textContent = msg;
      $('msg-success').style.display = 'block';
      $('msg-error').style.display = 'none';
    }

    let sessionReady = false;

    // Listen for the SIGNED_IN or PASSWORD_RECOVERY event triggered by the invite link
    supabase.auth.onAuthStateChange((event, session) => {
      if ((event === 'SIGNED_IN' || event === 'PASSWORD_RECOVERY') && session) {
        sessionReady = true;
        $('loading').style.display = 'none';
        $('form-section').style.display = 'block';
      }
    });

    // If no session event fires within 3s the link is expired
    setTimeout(() => {
      if (!sessionReady) {
        $('loading').style.display = 'none';
        $('expired-section').style.display = 'block';
      }
    }, 3000);

    $('set-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw  = $('password').value;
      const cfm = $('confirm').value;

      if (pw !== cfm) { showError('Passwords do not match.'); return; }
      if (pw.length < 8) { showError('Password must be at least 8 characters.'); return; }

      const btn = $('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';

      const { error } = await supabase.auth.updateUser({ password: pw });
      if (error) {
        showError(error.message);
        btn.disabled = false;
        btn.textContent = 'Set Password & Sign In';
        return;
      }

      showSuccess('Password set! Redirecting to dashboard…');
      setTimeout(() => { window.location.replace('/admin/dashboard'); }, 1500);
    });
  </script>
</body>
</html>
